version: "3.8"

services:
  backend:
    image: node:18
    container_name: backend_ci
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm start"
    ports:
      - "4000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production

  frontend:
    image: node:18
    container_name: frontend_ci
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npx serve -s dist"
    ports:
      - "8080:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
