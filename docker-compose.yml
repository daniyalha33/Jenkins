services:
  backend:
    image: node:18
    container_name: backend_ci
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "4000:3000"
    command: sh -c "npm install && npm start"

  frontend:
    image: node:20
    container_name: frontend_ci
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8080:5173" # vite default
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
